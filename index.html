<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属告白</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            width:100vw;
            height:100vh;
            background:linear-gradient(135deg,#ff99cc,#ff6699);
            overflow:hidden;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-family:"微软雅黑",sans-serif;
        }
        .title{
            font-size:40px;
            margin-bottom:30px;
            text-shadow:0 0 10px #fff;
            animation:shake 2s infinite;
        }
        .text{
            font-size:22px;
            line-height:2;
            text-align:center;
            margin:15px 0;
        }
        .heart{
            position:absolute;
            bottom:0;
            background:#fff;
            transform:rotate(-45deg);
            animation:up 5s infinite ease-in-out;
        }
        .heart:before,.heart:after{
            content:'';
            width:100%;
            height:100%;
            background:#fff;
            border-radius:50%;
            position:absolute;
        }
        .heart:before{top:-50%;left:0;}
        .heart:after{right:-50%;top:0;}
        .btn-box{
            margin-top:50px;
            display:flex;
            gap:40px;
        }
        button{
            padding:12px 35px;
            font-size:18px;
            border:none;
            border-radius:30px;
            cursor:pointer;
            transition:all 0.3s;
        }
        .yes{
            background:#ff3366;
            color:#fff;
        }
        .no{
            background:#fff;
            color:#ff6699;
        }
        .yes:hover{
            transform:scale(1.1);
        }
        @keyframes up{
            0%{transform:rotate(-45deg) translateY(0);opacity:1;}
            100%{transform:rotate(-45deg) translateY(-100vh);opacity:0;}
        }
        @keyframes shake{
            0%,100%{transform:scale(1);}
            50%{transform:scale(1.05);}
        }
    </style>
</head>
<body>
    <h1 class="title">我喜欢你</h1>
    <div class="text">
        遇见你的时候<br>
        所有星星都落到我头上<br>
        往后余生<br>
        风雪是你 平淡是你<br>
        满心欢喜 皆是你
    </div>
    <div class="text" style="margin-top:40px;font-size:26px;">
        愿意做我的恋人吗？
    </div>

    <div class="btn-box">
        <button class="yes" onclick="agree()">我愿意</button>
        <button class="no" id="refuse">再想想</button>
    </div>

    <script>
        function createHeart(){
            const heart = document.createElement('div');
            heart.className = 'heart';
            let size = Math.random()*20+10;
            heart.style.width = size+'px';
            heart.style.height = size+'px';
            heart.style.left = Math.random()*100+'vw';
            heart.style.animationDuration = Math.random()*3+3+'s';
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),5000);
        }
        setInterval(createHeart,300);

        function agree(){
            alert('太好啦！余生请多多指教❤️');
            document.body.style.background = 'linear-gradient(135deg,#ff4d88,#ff1464)';
        }

        let refuseBtn = document.getElementById('refuse');
        refuseBtn.onmouseover = function(){
            let x = Math.random() * 200 - 100;
            let y = Math.random() * 200 - 100;
            this.style.transform = `translate(${x}px,${y}px)`;
        }
    </script>
</body>
</html>
